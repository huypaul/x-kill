<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Slash A: Crimson / Hot Coral -->
    <linearGradient id="markSlashA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5277" />
      <stop offset="40%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#d90429" />
    </linearGradient>

    <!-- Slash A Highlight Core -->
    <linearGradient id="markSlashACore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#ff99bb" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ff0055" stop-opacity="0" />
    </linearGradient>

    <!-- Slash B: Electric Cyan / Neon Teal -->
    <linearGradient id="markSlashB" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>

    <!-- Drop Shadow / Glow Filters -->
    <filter id="markCrimsonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="markCyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Icon -->
  <circle cx="256" cy="256" r="140" fill="#ff0055" opacity="0.1" filter="url(#markCrimsonGlow)" />
  <circle cx="256" cy="256" r="100" fill="#00f0ff" opacity="0.08" filter="url(#markCyanGlow)" />

  <!-- Subtle Tactical HUD Elements -->
  <g opacity="0.35">
    <circle cx="256" cy="256" r="160" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3 6" />
    <circle cx="256" cy="256" r="115" fill="none" stroke="#00f0ff" stroke-width="1.2" stroke-dasharray="6 8" />
    <line x1="256" y1="76" x2="256" y2="96" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" />
    <line x1="256" y1="416" x2="256" y2="436" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" />
    <line x1="76" y1="256" x2="96" y2="256" stroke="#ff0055" stroke-width="2" stroke-linecap="round" />
    <line x1="416" y1="256" x2="436" y2="256" stroke="#ff0055" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Corner Brackets -->
  <g stroke-linecap="round" stroke-linejoin="round" opacity="0.65">
    <path d="M 96 136 L 96 96 L 136 96" fill="none" stroke="#ff0055" stroke-width="2.5" />
    <path d="M 376 96 L 416 96 L 416 136" fill="none" stroke="#00f0ff" stroke-width="2.5" />
    <path d="M 96 376 L 96 416 L 136 416" fill="none" stroke="#00f0ff" stroke-width="2.5" />
    <path d="M 376 416 L 416 416 L 416 376" fill="none" stroke="#ff0055" stroke-width="2.5" />
  </g>

  <!-- Slash B (Underneath / Sliced): Electric Cyan -->
  <g filter="url(#markCyanGlow)">
    <polygon points="282,135 342,135 377,170 292,238 250,204" fill="url(#markSlashB)" />
    <line x1="342" y1="135" x2="377" y2="170" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <line x1="282" y1="135" x2="250" y2="204" stroke="#e0fbfc" stroke-width="1.5" opacity="0.6" />

    <polygon points="220,274 262,308 170,377 135,342 220,274" fill="url(#markSlashB)" />
    <line x1="170" y1="377" x2="135" y2="342" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <line x1="135" y1="342" x2="220" y2="274" stroke="#e0fbfc" stroke-width="1.5" opacity="0.6" />
  </g>

  <!-- Slash A (Dominant Overlayer): Crimson Blade -->
  <g filter="url(#markCrimsonGlow)">
    <polygon points="135,170 170,135 230,135 377,342 342,377 282,377" fill="url(#markSlashA)" />
    <polygon points="135,170 170,135 200,135 347,342 342,377 312,377" fill="#ffffff" opacity="0.2" />
    <line x1="170" y1="135" x2="135" y2="170" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
    <line x1="377" y1="342" x2="342" y2="377" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
    <line x1="185" y1="152" x2="327" y2="360" stroke="url(#markSlashACore)" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Center Target Core -->
  <circle cx="256" cy="256" r="4.5" fill="#ffffff" filter="url(#markCyanGlow)" />
  <circle cx="256" cy="256" r="2" fill="#ffffff" />
</svg>
