<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="100%" height="100%">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c101a" />
      <stop offset="50%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#030407" />
    </linearGradient>

    <!-- Card Border -->
    <linearGradient id="logoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#ff3366" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#00f0ff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.5" />
    </linearGradient>

    <!-- Crimson Slash Gradient -->
    <linearGradient id="logoSlashA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5277" />
      <stop offset="40%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#d90429" />
    </linearGradient>

    <!-- Cyan Slash Gradient -->
    <linearGradient id="logoSlashB" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>

    <!-- Text Fill Gradient for 'kill' -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-x { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 900; font-size: 78px; fill: url(#logoSlashA); letter-spacing: -2px; }
    .title-kill { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 900; font-size: 78px; fill: url(#textGrad); letter-spacing: -2px; }
    .subtitle { font-family: "JetBrains Mono", "SF Mono", Consolas, Menlo, monospace; font-weight: 700; font-size: 13px; fill: #94a3b8; letter-spacing: 3.5px; text-transform: uppercase; }
    .badge-text { font-family: "JetBrains Mono", "SF Mono", Consolas, Menlo, monospace; font-size: 11px; font-weight: 600; fill: #cbd5e1; }
    .bracket { font-family: monospace; font-size: 26px; fill: #334155; }
  </style>

  <!-- Card Background -->
  <rect x="6" y="6" width="868" height="218" rx="28" fill="url(#logoBgGrad)" />
  <rect x="6" y="6" width="868" height="218" rx="28" fill="none" stroke="url(#logoBorder)" stroke-width="1.5" />

  <!-- Background Scanline / Terminal Mesh Effect -->
  <g opacity="0.07">
    <line x1="240" y1="20" x2="850" y2="20" stroke="#ffffff" stroke-width="1" stroke-dasharray="2 10" />
    <line x1="240" y1="45" x2="850" y2="45" stroke="#ffffff" stroke-width="1" stroke-dasharray="2 10" />
    <line x1="240" y1="70" x2="850" y2="70" stroke="#ffffff" stroke-width="1" stroke-dasharray="2 10" />
    <line x1="240" y1="95" x2="850" y2="95" stroke="#ffffff" stroke-width="1" stroke-dasharray="2 10" />
    <line x1="240" y1="120" x2="850" y2="120" stroke="#ffffff" stroke-width="1" stroke-dasharray="2 10" />
    <line x1="240" y1="145" x2="850" y2="145" stroke="#ffffff" stroke-width="1" stroke-dasharray="2 10" />
    <line x1="240" y1="170" x2="850" y2="170" stroke="#ffffff" stroke-width="1" stroke-dasharray="2 10" />
    <line x1="240" y1="195" x2="850" y2="195" stroke="#ffffff" stroke-width="1" stroke-dasharray="2 10" />
  </g>

  <!-- Left Side: Scaled Icon Emblem -->
  <g transform="translate(38, 25)">
    <!-- Squircle Backdrop -->
    <rect x="0" y="0" width="180" height="180" rx="44" fill="#0b0e17" stroke="url(#logoBorder)" stroke-width="1.5" />
    <circle cx="90" cy="90" r="62" fill="none" stroke="#64748b" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.3" />

    <!-- Corner HUD Marks -->
    <path d="M 22 36 L 22 22 L 36 22" fill="none" stroke="#ff0055" stroke-width="1.8" opacity="0.7" />
    <path d="M 144 22 L 158 22 L 158 36" fill="none" stroke="#00f0ff" stroke-width="1.8" opacity="0.7" />
    <path d="M 22 144 L 22 158 L 36 158" fill="none" stroke="#00f0ff" stroke-width="1.8" opacity="0.7" />
    <path d="M 144 158 L 158 158 L 158 144" fill="none" stroke="#ff0055" stroke-width="1.8" opacity="0.7" />

    <!-- Cyan Slash Segments -->
    <g filter="url(#logoGlow)">
      <polygon points="100,46 122,46 135,59 104,84 89,72" fill="url(#logoSlashB)" />
      <polygon points="78,96 93,108 60,134 47,121 78,96" fill="url(#logoSlashB)" />
    </g>

    <!-- Crimson Blade -->
    <g filter="url(#logoGlow)">
      <polygon points="47,59 60,46 82,46 135,121 122,134 100,134" fill="url(#logoSlashA)" />
      <line x1="60" y1="46" x2="47" y2="59" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.9" />
      <line x1="135" y1="121" x2="122" y2="134" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.9" />
      <line x1="65" y1="52" x2="116" y2="128" stroke="#ffffff" stroke-width="1.5" opacity="0.75" />
    </g>

    <!-- Center Reticle Point -->
    <circle cx="90" cy="90" r="2.5" fill="#ffffff" filter="url(#logoGlow)" />
  </g>

  <!-- Divider Line -->
  <line x1="242" y1="42" x2="242" y2="188" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Right Side: Brand Wordmark -->
  <!-- Main Title -->
  <g transform="translate(270, 96)">
    <text x="0" y="0">
      <tspan class="title-x">x</tspan><tspan class="title-kill">kill</tspan>
    </text>
    <!-- Cyan Energy Dot on 'i' -->
    <circle cx="120" cy="-60" r="4.5" fill="#00f0ff" filter="url(#logoGlow)" />
  </g>

  <!-- Subtitle Tagline -->
  <text x="274" y="128" class="subtitle">Fast Interactive Terminal Disk Cleaner</text>

  <!-- Tech Feature Badges -->
  <g transform="translate(274, 150)">
    <!-- Badge 1: FDIR SPEED -->
    <rect x="0" y="0" width="102" height="26" rx="6" fill="#111827" stroke="#ff0055" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="12" cy="13" r="3.5" fill="#ff0055" />
    <text x="22" y="17" class="badge-text">FDIR SPEED</text>

    <!-- Badge 2: SAFE TRASH -->
    <rect x="112" y="0" width="104" height="26" rx="6" fill="#111827" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="124" cy="13" r="3.5" fill="#00f0ff" />
    <text x="134" y="17" class="badge-text">SAFE TRASH</text>

    <!-- Badge 3: 16 WORKERS -->
    <rect x="226" y="0" width="106" height="26" rx="6" fill="#111827" stroke="#64748b" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="238" cy="13" r="3.5" fill="#64748b" />
    <text x="248" y="17" class="badge-text">16 WORKERS</text>

    <!-- Badge 4: INK / REACT 19 -->
    <rect x="342" y="0" width="112" height="26" rx="6" fill="#111827" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="354" cy="13" r="3.5" fill="#a855f7" />
    <text x="364" y="17" class="badge-text">REACT 19 TUI</text>
  </g>

  <!-- Top Right CLI Version Badge -->
  <g transform="translate(770, 36)">
    <rect x="0" y="0" width="68" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="34" y="15" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#38bdf8">v1.0.0</text>
  </g>
</svg>
