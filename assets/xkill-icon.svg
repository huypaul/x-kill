<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f" />
      <stop offset="50%" stop-color="#080b12" />
      <stop offset="100%" stop-color="#040609" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#ff3366" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#00f0ff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.8" />
    </linearGradient>

    <!-- Slash A: Crimson / Hot Coral -->
    <linearGradient id="slashAGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5277" />
      <stop offset="40%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#d90429" />
    </linearGradient>

    <!-- Slash A Highlight Core -->
    <linearGradient id="slashACore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ff99bb" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ff0055" stop-opacity="0" />
    </linearGradient>

    <!-- Slash B: Electric Cyan / Neon Teal -->
    <linearGradient id="slashBGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>

    <!-- Reticle Glow Gradient -->
    <linearGradient id="reticleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.5" />
    </linearGradient>

    <!-- Drop Shadow / Glow Filters -->
    <filter id="crimsonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <!-- Radial Ambient Glow -->
    <radialGradient id="centerAmbient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff0055" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Container Squircle with Shadow -->
  <g filter="url(#softShadow)">
    <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" />
    <rect x="32" y="32" width="448" height="448" rx="104" fill="none" stroke="url(#borderGrad)" stroke-width="2" />
  </g>

  <!-- Ambient Light in Center -->
  <circle cx="256" cy="256" r="180" fill="url(#centerAmbient)" />

  <!-- Subtle Tactical Grid & Crosshair -->
  <g opacity="0.18">
    <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="3 6" />
    <circle cx="256" cy="256" r="115" fill="none" stroke="#00f0ff" stroke-width="1" stroke-dasharray="6 8" />
    <line x1="256" y1="76" x2="256" y2="96" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" />
    <line x1="256" y1="416" x2="256" y2="436" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" />
    <line x1="76" y1="256" x2="96" y2="256" stroke="#ff0055" stroke-width="2" stroke-linecap="round" />
    <line x1="416" y1="256" x2="436" y2="256" stroke="#ff0055" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Tactical HUD Corner Brackets -->
  <g stroke-linecap="round" stroke-linejoin="round" opacity="0.5">
    <path d="M 88 128 L 88 88 L 128 88" fill="none" stroke="#ff0055" stroke-width="2.5" />
    <path d="M 384 88 L 424 88 L 424 128" fill="none" stroke="#00f0ff" stroke-width="2.5" />
    <path d="M 88 384 L 88 424 L 128 424" fill="none" stroke="#00f0ff" stroke-width="2.5" />
    <path d="M 384 424 L 424 424 L 424 384" fill="none" stroke="#ff0055" stroke-width="2.5" />
  </g>

  <!-- ==================== THE "X" MARK ==================== -->

  <!-- Slash B (Underneath / Sliced): Electric Cyan -->
  <!-- Top-Right Blade -->
  <g filter="url(#cyanGlow)">
    <polygon points="282,135 342,135 377,170 292,238 250,204" fill="url(#slashBGrad)" />
    <!-- Top-Right Highlight Edge -->
    <line x1="342" y1="135" x2="377" y2="170" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <line x1="282" y1="135" x2="250" y2="204" stroke="#e0fbfc" stroke-width="1.5" opacity="0.6" />
  </g>

  <!-- Bottom-Left Blade -->
  <g filter="url(#cyanGlow)">
    <polygon points="220,274 262,308 170,377 135,342 220,274" fill="url(#slashBGrad)" />
    <!-- Bottom-Left Highlight Edge -->
    <line x1="170" y1="377" x2="135" y2="342" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <line x1="135" y1="342" x2="220" y2="274" stroke="#e0fbfc" stroke-width="1.5" opacity="0.6" />
  </g>

  <!-- Slash A (Dominant Overlayer): Crimson Blade -->
  <g filter="url(#crimsonGlow)">
    <!-- Main Blade Polygon -->
    <polygon points="135,170 170,135 230,135 377,342 342,377 282,377" fill="url(#slashAGrad)" />

    <!-- Chiseled Facet / Bevel Overlay -->
    <polygon points="135,170 170,135 200,135 347,342 342,377 312,377" fill="#ffffff" opacity="0.18" />

    <!-- Sharp Top Edge Light -->
    <line x1="170" y1="135" x2="135" y2="170" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />

    <!-- Sharp Bottom Edge Light -->
    <line x1="377" y1="342" x2="342" y2="377" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />

    <!-- High-energy core beam down center of Slash A -->
    <line x1="185" y1="152" x2="327" y2="360" stroke="url(#slashACore)" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Center Target Core (The Crosshair Intersection) -->
  <circle cx="256" cy="256" r="4.5" fill="#ffffff" filter="url(#cyanGlow)" />
  <circle cx="256" cy="256" r="2" fill="#ffffff" />

  <!-- Digital Kill Sparks / Data Shards -->
  <polygon points="386,220 398,223 392,230" fill="#00f0ff" opacity="0.8" filter="url(#cyanGlow)" />
  <polygon points="114,282 126,285 120,292" fill="#ff0055" opacity="0.8" filter="url(#crimsonGlow)" />
</svg>
